name: build-apk

# Сборка Android APK на бесплатных раннерах GitHub (публичный репозиторий → без лимитов).
# Запуск: вручную (Actions → build-apk → Run workflow) или тегом vX.Y.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Опубликовать APK в Releases"
        default: "true"
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Godot 4.7.2 + шаблоны Android
        run: |
          set -e
          mkdir -p /opt/godot /tmp/dl
          curl -sL -o /tmp/dl/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -oq /tmp/dl/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          curl -sL -o /tmp/dl/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -o -j /tmp/dl/templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" \
            -d ~/.local/share/godot/export_templates/4.7.2.stable/
          /opt/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --version

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls $ANDROID_SDK_ROOT/platforms $ANDROID_SDK_ROOT/build-tools

      - name: Ключ подписи (debug)
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/.android/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Самотест игровой логики (headless)
        run: |
          /opt/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . -- --test | tee selftest.log
          grep -q SELFTEST_OK selftest.log

      - name: Экспорт APK
        run: |
          mkdir -p export
          /opt/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" 2>&1 | tail -5
          /opt/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Android" 2>&1 | tail -5 || true
          ls -la export/

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: needle-plus-apk
          path: export/*.apk
          retention-days: 30

      - name: Релиз
        if: github.event_name == 'push' || inputs.make_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-${{ github.run_number }}"
          gh release create "$TAG" export/*.apk \
            --title "NEEDLE+ — сборка $TAG" \
            --notes "APK из коммита ${{ github.sha }}. Установка: скачать .apk на телефон и открыть (разрешить установку из неизвестных источников)." \
            --prerelease || \
          gh release upload "$TAG" export/*.apk --clobber
